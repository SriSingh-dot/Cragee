<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu - Cragee</title>








<style>
@font-face{
    font-family:'Aesthetic';
    src:url('Aesthetic-Regular.otf');}
*{  margin:0;
    padding:0;
    box-sizing:border-box;}
body{
    min-height:100vh;
    background:url('s2.jpg') center center/cover no-repeat;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    overflow:hidden;}
body::before{
    content:"";
    position:fixed;
    top:18px;
    left:18px;
    right:18px;
    bottom:18px;
    border:2px solid rgba(255,255,255,0.8);
    pointer-events:none;
    z-index: 10;}
body::after{
    content:"";
    position:fixed;
    top:30px;
    left:30px;
    right:30px;
    bottom:30px;
    border:1px solid rgba(255,255,255,0.6);
    pointer-events:none;
    z-index: 10;
}
.container{
    width:min(900px,90%);
    text-align:center;
    position:relative;
    z-index: 5;
}
.heading{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:25px;
    margin-bottom:40px;}
.heading img{
    width:85px;
    height:auto;}
.heading h1{
    font-family:'Aesthetic',serif;
    color:white;
    font-size:clamp(50px,7vw,100px);
    font-weight:normal;
    text-shadow:
        0 0 5px rgba(255,255,255,0.2),
        0 0 10px rgba(255,255,255,0.15);
}
.menu-box{
    background:rgba(235,245,255,0.55);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-radius:35px;
    padding:50px 45px;
    position:relative;
        border: 4px solid #324a63;
        box-shadow:
        inset 0 0 0 3px rgba(255, 255, 255, 0.95), 
        inset 0 0 0 6px #324a63,                   
        0 15px 40px rgba(0,0,0,0.2),               
        inset 0 0 20px rgba(255,255,255,0.3);}
.menu-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 18px;
    max-width: 550px;
    margin: 0 auto;}
.menu-list li {
    position: relative;}
.menu-list li a {
    display: block;
    color: #324a63;
    font-family: 'Aesthetic', serif; 
    font-size: 22px; 
    letter-spacing: 0.5px;
    font-weight: normal;
    text-transform: capitalize;
    text-decoration: none;
    padding: 14px 25px;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.15);
    transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);    
    text-shadow: 0 1px 2px rgba(255, 255, 255, 0.4); }
.menu-list li a:hover {
    color: #1b2d3f;
    background: rgba(255, 255, 255, 0.75);
    letter-spacing: 2px; 
    transform: translateY(-2px);
    border-color: rgba(50, 74, 99, 0.3);
    box-shadow: 
        0 6px 20px rgba(50, 74, 99, 0.15),
        inset 0 0 10px rgba(255, 255, 255, 0.5);}
.menu-list li a:active {
    transform: translateY(1px);
    box-shadow: 0 3px 10px rgba(50, 74, 99, 0.1);
}
.snowflake {
    position: fixed;
    top: -10px;
    color: rgba(255, 255, 255, 0.85);
    font-family: serif;
    pointer-events: none;
    z-index: 1;
    user-select: none;
    animation: fall linear infinite;}
@keyframes fall {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;}
    10% {
        opacity: 1;}
    90% {
        opacity: 1;}
    100% {
        transform: translateY(105vh) rotate(360deg);
        opacity: 0;}}
@media(max-width:700px){
    .heading{
        gap:12px;
        margin-bottom: 30px;}
    .heading img{
        width:55px;}
    .menu-box{
        padding:35px 25px;
        border-width: 3px;
        border-radius: 28px;
        box-shadow:
            inset 0 0 0 2px rgba(255, 255, 255, 0.95), 
            inset 0 0 0 4px #324a63,                   
            0 10px 30px rgba(0,0,0,0.15);}
    .menu-list {
        gap: 14px;}
    .menu-list li a{
        font-size:18px; 
        padding:12px 20px;
        border-radius: 16px;
    }}
</style>
</head>









<body>
<div class="container">
    <div class="heading">
        <img src="c1.png" alt="">
        <h1>Menu</h1>
        <img src="c2.png" alt="">
    </div><div class="menu-box">
        <ul class="menu-list">
            <li><a href="index.html">Home</a></li>
            <li><a href="intro.html">Introduction</a></li>
            <li><a href="drama.html">Drama Preferences</a></li>
            <li><a href="book.html">Book Corner</a></li>
            <li><a href="song.html">Music Playlist</a></li></ul></div></div>








<script>
function createSnowflake() {
    const flake = document.createElement('div');
    flake.classList.add('snowflake');
    flake.innerText = '❅';
    flake.style.left = Math.random() * 100 + 'vw';
    flake.style.fontSize = Math.random() * 12 + 10 + 'px';
    flake.style.animationDuration = Math.random() * 5 + 4 + 's'; 
    flake.style.animationDelay = Math.random() * 5 + 's';
    flake.style.opacity = Math.random() * 0.6 + 0.3;
    document.body.appendChild(flake);
    setTimeout(() => {
        flake.remove();
    }, 9000);}
for(let i = 0; i < 35; i++) {
    createSnowflake();}
setInterval(createSnowflake, 200);
</script>













</body>
</html>
