<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drama Showcase - Cragee</title>



<style>
@font-face{
    font-family:'Aesthetic';
    src:url('Aesthetic-Regular.otf');}
*{  margin:0;
    padding:0;
    box-sizing:border-box;}
body{
    min-height:100vh;
    background:url('s2.jpg') center center/cover no-repeat;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;}
body::before{
    content:"";
    position:fixed;
    top:18px;
    left:18px;
    right:18px;
    bottom:18px;
    border-left:2px solid rgba(255,255,255,0.8);
    border-right:2px solid rgba(255,255,255,0.8);
    border-bottom:2px solid rgba(255,255,255,0.8);
    pointer-events:none;}
body::after{
    content:"";
    position:fixed;
    top:30px;
    left:30px;
    right:30px;
    bottom:30px;
    border-left:1px solid rgba(255,255,255,0.6);
    border-right:1px solid rgba(255,255,255,0.6);
    border-bottom:1px solid rgba(255,255,255,0.6);
    pointer-events:none;
}
.container{
    width:95%;
    max-width:1500px;
    text-align:center;}
h1{
    font-family:'Aesthetic', serif;
    font-weight:normal;
    color:white;
    font-size:clamp(50px,6vw,80px);
    margin-bottom:35px;
    text-shadow:
        0 0 4px rgba(255,255,255,0.18),
        0 0 8px rgba(255,255,255,0.12);
}
.showcase-box{
    width:92%;      
    max-width:1350px;
    margin:0 auto;
    background:rgba(235,245,255,0.45);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.5);
    border-radius:40px;
    padding:40px 18px;
    box-shadow:
        0 10px 40px rgba(0,0,0,0.12),
        inset 0 0 15px rgba(255,255,255,0.35);
    position:relative;
    overflow:hidden;}
.nav{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:75px;
    cursor:pointer;
    transition:.3s;
    z-index:20;
    user-select:none;}
.nav:hover{
    transform:translateY(-50%) scale(1.12);}
.prev{
    left:20px;}
.next{
    right:20px;}
.showcase{
    position:relative;
    height:290px;
    display:flex;
    justify-content:center;
    align-items:center;
}
.card{
    position:absolute;
    transition:
        transform .8s ease,
        opacity .8s ease,
        filter .8s ease;}
.card img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:25px;
    border:2px solid rgba(255,255,255,.8);
    box-shadow:
        0 15px 30px rgba(0,0,0,.25);}
.title{
    margin-top:25px;
    font-family:Georgia, serif;
    color:#35506f;
    font-size:30px;
    min-height:40px;
    font-weight:bold;}
@media(max-width:900px){
    .showcase{
        height:320px;}
    .nav{
        width:55px;}
    .title{
        font-size:22px;}
}
</style>
</head>










<body>
<div class="container">
    <h1>Drama Showcase</h1>
    <div class="showcase-box">
        <img src="c4.png" class="nav prev" id="prev">
        <img src="c3.png" class="nav next" id="next">
        <div class="showcase" id="showcase"></div>
        <div class="title" id="title">Drama Name</div></div></div>
        
        
        
        
        
        
        



<script>
const dramas = [
    {img:"d1.jpg", name:"A Dream Within A Dream"},
    {img:"d2.jpg", name:"The Prisoner of Beauty"},
    {img:"d3.jpg", name:"The Glory (Chinese)"},
    {img:"d4.jpg", name:"My Royal Nemesis"},
    {img:"d5.jpg", name:"General's Lady"},
    {img:"d6.jpg", name:"The Glory"},
    {img:"d7.jpg", name:"Business Proposal"},
    {img:"d8.jpg", name:"It's Okay To Not Be Okay"},
    {img:"d9.jpg", name:"Marry My Husband"},
    {img:"d10.jpg", name:"Lovely Runner"}];
const showcase = document.getElementById("showcase");
const title = document.getElementById("title");
let current = 4;
dramas.forEach(drama => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<img src="${drama.img}" alt="">`;
    showcase.appendChild(card);});
const cards = document.querySelectorAll(".card");
function updateShowcase(){
    cards.forEach((card,index)=>{
        let offset = index - current;
        if(offset > dramas.length/2)
            offset -= dramas.length;
        if(offset < -dramas.length/2)
            offset += dramas.length;
        const abs = Math.abs(offset);
        let scale = 1;
        let opacity = 1;
        let blur = 0;
        let z = 100 - abs;
        if(abs === 0){
            scale = 1.25;}
        else if(abs === 1){
            scale = .95;
            opacity = .85;
            blur = .5;}
        else if(abs === 2){
            scale = .75;
            opacity = .65;
            blur = 1;}
        else if(abs === 3){
            scale = .55;
            opacity = .45;
            blur = 2;}
        else{
            scale = .38;
            opacity = .2;
            blur = 3;}
        const x = offset * 140;
        card.style.zIndex = z;
        card.style.transform =
        `translateX(${x}px) scale(${scale})`;
        card.style.opacity = opacity;
        card.style.filter = `blur(${blur}px)`;
        card.style.width = "200px";
        card.style.height = "280px";});
    title.textContent = dramas[current].name;
}document.getElementById("next").onclick = () => {
    current++;
    if(current >= dramas.length)
        current = 0;
    updateShowcase();};
document.getElementById("prev").onclick = () => {
    current--;
    if(current < 0)
        current = dramas.length - 1;
    updateShowcase();};
updateShowcase();
</script>









</body>
</html>
