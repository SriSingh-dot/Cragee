<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drama Showcase - Cragee</title>



<style>
@font-face{
    font-family:'Aesthetic';
    src:url('Aesthetic-Regular.otf');}
*{  margin:0;
    padding:0;
    box-sizing:border-box;}
body{
    min-height:100vh;
    background:url('s2.jpg') center center/cover no-repeat;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;}






.card{
    position:absolute;
    transition:
        transform .8s ease,
        opacity .8s ease,
        filter .8s ease;}
.card img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:25px;
    border:2px solid rgba(255,255,255,.8);
    box-shadow:
        0 15px 30px rgba(0,0,0,.25);}
.title{
    margin-top:25px;
    font-family:Georgia, serif;
    color:#35506f;
    font-size:30px;
    min-height:40px;
    font-weight:bold;}
@media(max-width:900px){
    .showcase{
        height:320px;}
    .nav{
        width:55px;}
    .title{
        font-size:22px;}
}
</style>
</head>










<body>
<div class="container">
    <h1>Drama Showcase</h1>
    <div class="showcase-box">
        <img src="c4.png" class="nav prev" id="prev">
        <img src="c3.png" class="nav next" id="next">
        <div class="showcase" id="showcase"></div>
        <div class="title" id="title">Drama Name</div></div></div>
        
        
        
        
        
        
        



<script>
const dramas = [
    {img:"d1.jpg", name:""},
    {img:"d2.jpg", name:""},
    {img:"d3.jpg", name:""},
    {img:"d4.jpg", name:""},
    {img:"d5.jpg", name:""},
    {img:"d6.jpg", name:""},
    {img:"d7.jpg", name:""},
    {img:"d8.jpg", name:""},
    {img:"d9.jpg", name:""},
    {img:"d10.jpg", name:""}];
const showcase = document.getElementById("showcase");
const title = document.getElementById("title");
let current = 4;
dramas.forEach(drama => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<img src="${drama.img}" alt="">`;
    showcase.appendChild(card);});
const cards = document.querySelectorAll(".card");
function updateShowcase(){
    cards.forEach((card,index)=>{
        let offset = index - current;
        if(offset > dramas.length/2)
            offset -= dramas.length;
        if(offset < -dramas.length/2)
            offset += dramas.length;
        const abs = Math.abs(offset);
        let scale = 1;
        let opacity = 1;
        let blur = 0;
        let z = 100 - abs;
        if(abs === 0){
            scale = 1.25;}
        else if(abs === 1){
            scale = .95;
            opacity = .85;
            blur = .5;}
        else if(abs === 2){
            scale = .75;
            opacity = .65;
            blur = 1;}
        else if(abs === 3){
            scale = .55;
            opacity = .45;
            blur = 2;}
        else{
            scale = .38;
            opacity = .2;
            blur = 3;}
        const x = offset * 170;
        card.style.zIndex = z;
        card.style.transform =
        `translateX(${x}px) scale(${scale})`;
        card.style.opacity = opacity;
        card.style.filter = `blur(${blur}px)`;
        card.style.width = "220px";
        card.style.height = "310px";});
    title.textContent = dramas[current].name;
}document.getElementById("next").onclick = () => {
    current++;
    if(current >= dramas.length)
        current = 0;
    updateShowcase();};
document.getElementById("prev").onclick = () => {
    current--;
    if(current < 0)
        current = dramas.length - 1;
    updateShowcase();};
updateShowcase();
</script>









</body>
</html>
