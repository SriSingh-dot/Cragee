<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Overview - Cragee</title>







    <style>
        @font-face {
            font-family: 'Aesthetic';
            src: url('Aesthetic-Regular.otf');}
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;}
        body {
            min-height: 100vh;
            background: url('s2.jpg') center center/cover no-repeat fixed;
            font-family: 'Aesthetic', Georgia, serif; 
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 40px 20px;}
        body::before {
            content: "";
            position: fixed;
            top: 18px;
            left: 18px;
            right: 18px;
            bottom: 18px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            pointer-events: none;
            z-index: 10;}
        body::after {
            content: "";
            position: fixed;
            top: 30px;
            left: 30px;
            right: 30px;
            bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            pointer-events: none;
            z-index: 10;}
        .container {
            width: min(850px, 95%);
            text-align: center;
            z-index: 5;
        }
        .heading h1 {
            color: white;
            font-size: 75px;
            font-weight: normal;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
            margin-bottom: 25px;
        }






      
        .intro-box {
            background: rgba(235, 245, 255, 0.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 35px;
            padding: 50px 45px;
            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.15),
                inset 0 0 15px rgba(255, 255, 255, 0.4);
            text-align: left;}
        .intro-box h2 {
            color: #324a63;
            font-size: 2.8rem;
            font-weight: normal;
            margin-bottom: 5px;
            text-align: center;}
        .intro-box .rating {
            color: #5c7a99;
            font-size: 1.3rem;
            margin-bottom: 30px;
            text-align: center;}
        .summary-content p {
            color: #324a63;
            font-size: 19px;
            line-height: 1.8;
            margin-bottom: 20px;
            letter-spacing: 0.3px;}
        .btn-wrapper {
            text-align: center;
            margin-top: 20px;}
        .back-btn {
            display: inline-block;
            text-decoration: none;
            color: #324a63;
            border: 1px solid #324a63;
            padding: 12px 30px;
            border-radius: 20px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.2);}
        .back-btn:hover {
            background: #324a63;
            color: white;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>





<div class="container">
    <div class="heading">
        <h1>Book Overview</h1></div>
        <div class="intro-box">
        <h2 id="book-title">Loading book .......</h2>
        <div class="rating" id="book-rating"></div>
        <div class="summary-content" id="book-description">
            <p>Loading summary guysssss.......</p>
        </div>
        <div class="btn-wrapper">
            <a href="books.html" class="back-btn">← Return to Book Preferences</a>
        </div></div></div>








<script>
    const bookData = {
        "pride": {
            title: "Pride and Prejudice",
            rating: "4.8/5",
            desc: `<p>Set in 19th-century England, Pride and Prejudice is basically about Elizabeth Bennet and this ultrarich, insanely arrogant egoistic guy named Mr. Darcy(i do not know the whole name heheh). He brutally wounds her pride at first, so she immediately cancels him. But after a lot of family drama, he drops his snobbery, she drops her quick judgments, and they finally date.</p>`},
        "viscount": {
            title: "The Viscount Who Loved Me",
            rating: " 4.6/5",
            desc: `<p>The Viscount Who Loved Me by Julia Quinn is that chaotic book behind season two of Netflix's Bridgerton where Anthony, the eldest sibling and biggest egoistic persoe alive, suddenly decides he needs a wife but refuses to actually love her. He picks the season's diamond, but her fiercely protective older sister Kate sees right through his playboy nonsense and completely hates his guts. We see his playboy nature fading. It is pure enemies to lovers insanity with lots of petty bickering, a wildly unhinged game of Pall Mall, and them trying not to choke each other before they inevitably fall in love. Before they realise, their mutual hatred for each other soon results in mutual care and respect for eachother.</p>`},
        "numbers": {
            title: "A Mind for Numbers",
            rating: " 4.9/5",
            desc: `<p>This book by engineering prof Barbara Oakley is basically a guide on how to actually use your brain for math and science without losing your mind. It shows how your brain switches between deep focus and relaxed, creative modes to solve hard stuff. Plus, it attacks procrastination and last-minute cramming by giving you useful tricks like active recall and chunking so you actually learn. Well there are also a lots of activities given in the book</p>`},
        "friends": {
            title: "Deep Work",
            rating: " 4.7/5",
            desc: `<p>Deep Work by Cal Newport is a brutal reality check on how to stop scrolling and actually focus. He calls out our addiction to notifications, arguing that locking in without distractions is a rare superpower. It gives you raw strategies to isolate your brain, get into a flow state, and actually finish high-quality work instead of just pretending to look busy.</p>`},
        "worstbestman": {
            title: "The Worst Best Man",
            rating: " 4.5/5",
            desc: `<p>The Worst Best Man by Mia sosa is this chaotic enemies to lovers romantic comedy  about Lina whuch is the female lead and  a wedding planner who got brutally dumped at her own wedding. many years later she gets a huge career chance but the catch is she has to work with the worst person alive, her ex's arrogant brother who literally convinced him to dump her. Itss tons of forced proximity, petty banter, and them trying not to kill each other before they obviously catch feelings.</p>`},
        "divinerivals": {
            title: "Divine Rivals",
            rating: " 4.9/5",
            desc: `<p>Divine Rivals by Rebecca Ross is this chaotic war war I setted historical fantasy romance about Iris and Roman, two rival journalists competing for the same promotion for same position. They are secretly sending anonymous letters to each other through these magical typewriters, completely clueless about who is on the other side. But then Iris heads straight into a brutal war between literal gods to find her missing brother, Roman follows her, and everything gets incredibly messy shocking and heartbreaking at the same time</p>`}};
    const urlParams = new URLSearchParams(window.location.search);
    const selectedBookKey = urlParams.get('book');
    if (selectedBookKey && bookData[selectedBookKey]) {
        document.getElementById("book-title").innerText = bookData[selectedBookKey].title;
        document.getElementById("book-rating").innerText = bookData[selectedBookKey].rating;
        document.getElementById("book-description").innerHTML = bookData[selectedBookKey].desc;
       } else {
        document.getElementById("book-title").innerText = "No Book Selected";
        document.getElementById("book-rating").innerText = "";
        document.getElementById("book-description").innerHTML = "<p style='text-align:center;'>Please return to your book shelf to pick a preference option.</p>";}
</script>







</body>
</html>
