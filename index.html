<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home - Cragee</title>
<link rel="icon" type="image/png" href="icon.png">




<style>
@font-face{
    font-family:'Aesthetic';
    src:url('Aesthetic-Regular.otf');}
*{
    margin:0;
    padding:0;
    box-sizing:border-box;}
body{
    width:100%;
    height:100vh;
    overflow:hidden;
}
.hero{
    width:100%;
    height:100vh;
    background:url('s1.jpg') center center/cover no-repeat;
    display:flex;
    justify-content:center;
    align-items:center;}
.content{
    display:flex;
    flex-direction:column;
    align-items:center;
    z-index:10;
}
.logo{
    font-family:'Aesthetic', serif;
    font-size:clamp(70px, 12vw, 180px);
    color:white;
    letter-spacing:4px;
    text-shadow:
        0 0 10px rgba(255,255,255,.7),
        0 0 30px rgba(255,255,255,.4);
}
.buttons{
    display:flex;
    gap:25px;
    margin-top:20px;}
.btn{
    position:relative;
    font-family:'Aesthetic', serif;
    font-size:28px;
    color:white;
    text-decoration:none;
    padding:14px 55px;
    background:transparent;
    border:2px solid white;
    border-radius:999px;
    transition:.3s ease;}
.btn::before{
    content:"";
    position:absolute;
    top:5px;
    left:5px;
    right:5px;
    bottom:5px;
    border:1px solid rgba(255,255,255,.85);
    border-radius:999px;
    pointer-events:none;}
.btn:hover{
    transform:translateY(-3px);
    box-shadow:
        0 0 15px rgba(255,255,255,.4);
}
.snow{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:999;}
.flake{
    position:absolute;
    top:-120px;
    color:white;
    opacity:.8;
    animation:fall linear infinite;}
.flake:nth-child(1){left:5%;font-size:12px;animation-duration:8s;}
.flake:nth-child(2){left:15%;font-size:18px;animation-duration:12s;}
.flake:nth-child(3){left:25%;font-size:35px;animation-duration:15s;}
.flake:nth-child(4){left:35%;font-size:16px;animation-duration:11s;}
.flake:nth-child(5){left:45%;font-size:50px;animation-duration:18s;}
.flake:nth-child(6){left:55%;font-size:20px;animation-duration:13s;}
.flake:nth-child(7){left:65%;font-size:40px;animation-duration:17s;}
.flake:nth-child(8){left:75%;font-size:17px;animation-duration:12s;}
.flake:nth-child(9){left:85%;font-size:60px;animation-duration:20s;}
.flake:nth-child(10){left:95%;font-size:18px;animation-duration:11s;}
.giant{
    left:20%;
    font-size:80px;
    animation-duration:22s;
    opacity:.5;}
.giant2{
    left:70%;
    font-size:100px;
    animation-duration:25s;
    opacity:.4;}
@keyframes fall{
    from{
        transform:translateY(-120px) translateX(0);}
    to{
        transform:translateY(120vh) translateX(60px);
    }}
</style>
</head>





<body>
<div class="hero">
    <div class="content">
        <h1 class="logo">Cragee</h1>
        <div class="buttons">
            <a href="intro.html" class="btn">Intro</a>
            <a href="menu.html" class="btn">Menu</a>
        </div></div></div>






<div class="snow">
    <div class="flake">❅</div>
    <div class="flake">❅</div>
    <div class="flake">❅</div>
    <div class="flake">❅</div>
    <div class="flake">❅</div>
    <div class="flake">❅</div>
    <div class="flake">❅</div>
    <div class="flake">❅</div>
    <div class="flake">❅</div>
    <div class="flake">❅</div>
    <div class="flake giant">❅</div>
    <div class="flake giant2">❅</div>
</div>





</body>







</html>
